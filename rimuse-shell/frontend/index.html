<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/svg+xml" href="/wails.png"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>Rimuse</title>
    <script>
      // Initialize theme before any content loads (mirrors official index.html).
      // Reads the legacy flat keys; the shell shim persists under rimuse.settings,
      // so a miss simply falls back to system preference until React hydrates.
      (function () {
        function initializeTheme() {
          try {
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            var useSystemTheme = localStorage.getItem('use_system_theme') === 'true';
            var savedTheme = localStorage.getItem('theme');
            var isDark = useSystemTheme || savedTheme === null
              ? prefersDark
              : savedTheme === 'dark';
            if (isDark) {
              document.documentElement.classList.add('dark');
              document.documentElement.style.colorScheme = 'dark';
            } else {
              document.documentElement.classList.remove('dark');
              document.documentElement.style.colorScheme = 'light';
            }
          } catch (error) {
            console.warn('Failed to initialize theme:', error);
          }
        }
        initializeTheme();
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function () {
            setTimeout(initializeTheme, 50);
          });
        }
      })();
    </script>
    <!-- CSS 由 main.tsx import（styles/ours.css → @goose/styles/main.css），这里不再 link -->
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
