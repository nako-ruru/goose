[package]
name = "rimuse-shell"
version = "0.1.0"
edition = "2021"

# Standalone package: opt out of the goose repo workspace above us so local
# builds don't join workspace.members (remote builds never see it).
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
include_dir = "0.7"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[profile.release]
debug = false
